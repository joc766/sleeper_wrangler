<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#32435a">
        <script>
            try {
                document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
            } catch {
                document.documentElement.dataset.theme = "light";
            }
        </script>
        <title>ymsdfootball.com</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap"
        />
        <link rel="stylesheet" href="/styles.css" />
        <script type="module" src="/app.js"></script>
        <script type="module" src="/chart.js"></script>
        <script type="module" src="/settings.js"></script>
    </head>
    <body>
        <main>
            <div class="sticky-header">
                <header class="site-header">
                    <h1>ymsdfootball.com</h1>
                    <button type="button" id="settings-open" class="settings-menu" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-dialog">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                    </button>
                </header>
                <nav class="view-toggle" aria-label="Choose view" role="tablist">
                    <button type="button" id="projections-toggle" role="tab" aria-selected="true" aria-pressed="true" aria-controls="projections-view" tabindex="0">Tracker</button>
                    <button type="button" id="history-toggle" role="tab" aria-selected="false" aria-pressed="false" aria-controls="history-view" tabindex="-1">Chart</button>
                </nav>
                <button type="button" id="scroll-to-top" class="scroll-to-top" aria-label="Scroll tracker to top" hidden>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 14 7-5 7 5" /></svg>
                </button>
            </div>
            <div class="view-content" tabindex="0" role="region" aria-label="Tracker and chart content">
            <div id="projections-view">
            <header class="page-header">
                <div class="week-row">
                    <h2 id="week-number" class="week-number" aria-live="polite"></h2>
                    <div class="connection-meta">
                        <button id="connection" class="connection-indicator is-reconnecting" type="button" aria-label="Connecting to live updates" aria-describedby="connection-tooltip" aria-expanded="false">
                            <span class="connection-light" aria-hidden="true"></span>
                        </button>
                        <span id="connection-tooltip" class="connection-tooltip" role="tooltip">Connecting to live updates…</span>
                    </div>
                </div>
            </header>
            <p id="notice" role="status">Waiting for simulation results…</p>
                <section id="results" aria-label="Tracker results" hidden>
                <div id="loser-card" class="loser-card" role="status" hidden>
                    <div class="beer-glass" aria-hidden="true">
                        <div class="beer-liquid">
                            <span class="beer-bubbles"></span>
                        </div>
                    </div>
                    <p id="loser-label" class="loser-label"></p>
                    <h2 id="loser-name" class="loser-name"></h2>
                    <div id="loser-history" class="loser-history" hidden>
                        <p id="loser-loss-number" class="loser-loss-number"></p>
                        <p id="loser-last-loss"></p>
                    </div>
                </div>
                <ol id="users" class="leaderboard" role="list"></ol>
            </section>
            </div>
            <div id="history-view" hidden>
                <header class="page-header">
                    <div class="week-row">
                        <h2 id="chart-week" class="week-number" aria-live="polite"></h2>
                    </div>
                </header>
                <p id="chart-notice" role="status">Loading loser counts…</p>
                <section id="chart-results" aria-label="Loser statistics chart" hidden>
                    <div class="counts-plot">
                        <canvas id="losses-chart" role="img" aria-label="Total losses per player, split by season"></canvas>
                    </div>
                    <ul id="chart-users" class="visually-hidden"></ul>
                </section>
            </div>
            <noscript
                >Enable JavaScript to receive live simulation results.</noscript
            >
            </div>
        </main>
        <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
            <div class="settings-heading">
                <h2 id="settings-title" tabindex="-1" autofocus>Settings</h2>
                <form method="dialog"><button class="settings-close" aria-label="Close settings">×</button></form>
            </div>
            <fieldset class="theme-options">
                <legend>Appearance</legend>
                <label><input type="radio" name="theme" value="light" checked /> Light</label>
                <label><input type="radio" name="theme" value="dark" /> Dark</label>
            </fieldset>
        </dialog>
    </body>
</html>
