<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ymsdfootball.com</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap"
        />
        <link rel="stylesheet" href="/styles.css" />
        <script type="module" src="/app.js"></script>
        <script type="module" src="/chart.js"></script>
    </head>
    <body>
        <main>
            <header class="site-header">
                <h1>ymsdfootball.com</h1>
            </header>
            <nav class="view-toggle" aria-label="Choose view" role="tablist">
                <button type="button" id="projections-toggle" role="tab" aria-selected="true" aria-pressed="true" aria-controls="projections-view">Tracker</button>
                <button type="button" id="history-toggle" role="tab" aria-selected="false" aria-pressed="false" aria-controls="history-view">Chart</button>
            </nav>
            <div id="projections-view">
            <header class="page-header">
                <div class="week-row">
                    <h2 id="week-number" class="week-number" aria-live="polite"></h2>
                    <div class="connection-meta">
                        <button id="connection" class="connection-indicator is-reconnecting" type="button" aria-label="Connecting to live updates" aria-describedby="connection-tooltip" aria-expanded="false">
                            <span class="connection-light" aria-hidden="true"></span>
                        </button>
                        <span id="connection-tooltip" class="connection-tooltip" role="tooltip">Connecting to live updates…</span>
                    </div>
                </div>
            </header>
            <p id="notice" role="status">Waiting for simulation results…</p>
                <section id="results" aria-label="Tracker results" hidden>
                <div id="loser-card" class="loser-card" role="status" hidden>
                    <div class="beer-glass" aria-hidden="true">
                        <div class="beer-liquid">
                            <span class="beer-bubbles"></span>
                        </div>
                    </div>
                    <p id="loser-label" class="loser-label"></p>
                    <h2 id="loser-name" class="loser-name"></h2>
                    <div id="loser-history" class="loser-history" hidden>
                        <p id="loser-loss-number" class="loser-loss-number"></p>
                        <p id="loser-last-loss"></p>
                    </div>
                </div>
                <ol id="users" class="leaderboard" role="list"></ol>
            </section>
            </div>
            <div id="history-view" hidden>
                <header class="page-header">
                    <div class="week-row">
                        <h2 id="chart-week" class="week-number" aria-live="polite"></h2>
                    </div>
                </header>
                <p id="chart-notice" role="status">Loading loser counts…</p>
                <section id="chart-results" aria-label="Loser statistics chart" hidden>
                    <div class="counts-plot">
                        <canvas id="losses-chart" role="img" aria-label="Total losses per player, split by season"></canvas>
                    </div>
                    <ul id="chart-users" class="visually-hidden"></ul>
                </section>
            </div>
            <noscript
                >Enable JavaScript to receive live simulation results.</noscript
            >
        </main>
    </body>
</html>
