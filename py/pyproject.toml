[project]
name = "sleeper-wrangler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Jack", email = "razor-hautes01@icloud.com" }]
requires-python = ">=3.14"
dependencies = ["pandas>=1.3.0", "requests>=2.25.1", "numpy>=2.5.3"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipython",
]

[project.scripts]
sleeper-wrangler = "sleeper_wrangler:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
